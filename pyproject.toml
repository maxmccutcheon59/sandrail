[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandrail"
version = "0.2.0"
description = "Local-first AI eval harness / agent sandbox CLI — secure-by-default scoring for agent backends"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Max McCutcheon", email = "MaxMcCutcheon1@outlook.com" }]
keywords = [
    "eval",
    "harness",
    "agent",
    "sandbox",
    "cli",
    "ai",
    "testing",
    "local-first",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
]
dependencies = [
    "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]
openai = []  # stdlib urllib only; marker for docs/install extras

[project.scripts]
sandrail = "sandrail.cli:main"

[project.urls]
Homepage = "https://github.com/maxmccutcheon59/sandrail"
Repository = "https://github.com/maxmccutcheon59/sandrail"
Issues = "https://github.com/maxmccutcheon59/sandrail/issues"
Security = "https://github.com/maxmccutcheon59/sandrail/blob/main/SECURITY.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = [".git", ".venv", "*.egg-info"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
