name: tool-sandbox-timeout
description: Per-case timeout enforcement (slow sleep → exit 124).
cases:
  - id: timeout-sleep
    description: python3 sleep exceeds per-case timeout
    tags: [subprocess, timeout]
    timeout_sec: 0.4
    input:
      argv: ["python3", "-c", "import time; time.sleep(10)"]
    expect:
      exit_code: 124
      stderr_contains: ["timeout"]

  - id: timeout-fast-ok
    description: Fast allow-listed command still passes under a short timeout
    tags: [subprocess, timeout, smoke]
    timeout_sec: 5
    input:
      argv: ["python3", "-c", "print('fast-ok')"]
    expect:
      exit_code: 0
      stdout_contains: ["fast-ok"]
