name: tool-sandbox-allowlist-smoke
description: Allow-listed argv under sandbox defaults (network denied, shell=False).
cases:
  - id: echo-ok
    description: Allow-listed echo
    tags: [subprocess, allow-list, smoke]
    input:
      argv: ["echo", "sandbox-ok"]
    expect:
      exit_code: 0
      stdout_contains: ["sandbox-ok"]

  - id: python-ok
    description: Allow-listed python3 one-liner
    tags: [subprocess, allow-list, smoke]
    input:
      argv: ["python3", "-c", "print(2+2)"]
    expect:
      exit_code: 0
      stdout_contains: ["4"]

  - id: printf-ok
    description: Allow-listed printf
    tags: [subprocess, allow-list, smoke]
    input:
      argv: ["printf", "%s", "printf-ok"]
    expect:
      exit_code: 0
      stdout_contains: ["printf-ok"]

  - id: true-ok
    description: Allow-listed true
    tags: [subprocess, allow-list, smoke]
    input:
      argv: ["true"]
    expect:
      exit_code: 0
